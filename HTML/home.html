    <script>
	function sha256(str) {
		const encoder = new TextEncoder();
		const data = encoder.encode(str);
		return crypto.subtle.digest('SHA-256', data)
			.then(hash => {
				const hex = Array.from(new Uint8Array(hash))
					.map(b => b.toString(16).padStart(2, '0'))
					.join('');
				return hex;
			});
	}
	
	function checkSession() {
		// 检查是否有有效的会话
		const sessionData = localStorage.getItem('home_page_session');
		if (sessionData) {
			try {
				const data = JSON.parse(sessionData);
				const currentTime = Date.now();
				const sessionTime = data.timestamp;
				const TEN_MINUTES = 10 * 60 * 10**3;
				
				// 检查会话是否在10分钟内
				if (currentTime - sessionTime < TEN_MINUTES) {
					return true; // 会话有效
				}
			} catch (error) {
				// 会话数据无效，清除
				localStorage.removeItem('home_page_session');
			}
		}
		return false; // 会话无效
	}
	
	function saveSession() {
		// 保存会话信息
		const sessionData = {
			timestamp: Date.now()
		};
		localStorage.setItem('home_page_session', JSON.stringify(sessionData));
	}
	
	async function verifyPassword() {
		// 先检查会话
		if (checkSession()) {
			document.getElementById('content').style.display = 'block';
			return;
		}
		
		var password = prompt("请输入访问密码:");
		if (!password) {
			alert("请输入密码！");
			setTimeout(verifyPassword, 1000);
			return;
		}
		
		try {
			const hashed = await sha256(password);
			const correctHash = "8a931bec173d59343f0d062ad401174fd8147b7ecad93f127e5b16e68ccf2352";
			
			if (hashed === correctHash) {
				saveSession(); // 保存会话
				document.getElementById('content').style.display = 'block';
			} else {
				alert("密码错误，请重试！");
				verifyPassword();
			}
		} catch (error) {
			alert("验证失败，请重试。");
			verifyPassword();
		}
	}

	// 页面加载时自动验证密码
	window.onload = function() {
