<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>无标题文档</title>
	<link rel="stylesheet" href="../CSS/home.css" type="text/css">
    
    <script>
	function sha256(str) {
		const encoder = new TextEncoder();
		const data = encoder.encode(str);
		return crypto.subtle.digest('SHA-256', data)
			.then(hash => {
				const hex = Array.from(new Uint8Array(hash))
					.map(b => b.toString(16).padStart(2, '0'))
					.join('');
				return hex;
			});
	}
	
	async function checkPassword() {
		var password = prompt("请输入访问密码:");
		if (!password) return false;
		
		try {
			const hashed = await sha256(password);
			const correctHash = "8a931bec173d59343f0d062ad401174fd8147b7ecad93f127e5b16e68ccf2352";
			
			if (hashed === correctHash) {
				window.open("me.html", "_blank");
			} else {
				alert("密码错误，请重试！");
			}
		} catch (error) {
			alert("验证失败，请重试。");
		}
		return false;
	}
	</script>
    
</head>

<body>
	<h1>个人主页</h1>
	<p class = "name"><a href="../index.html" target="_blank">首页</a>&nbsp;|
        &nbsp;<a href="me.html" onclick="return checkPassword();">简介</a>&nbsp;|&nbsp;爱好&nbsp;|&nbsp;联系我</p>
</body>
</html>
